# layer8report.com — HTTPS (managed by golive.sh)
# Static site from public/, API proxied to layer8d on 127.0.0.1:48808.

limit_req_zone $binary_remote_addr zone=layer8report_limit:10m rate=10r/s;

# Filing is a POST. Everything else only hits the general limit.
map $request_method $layer8report_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $layer8report_post zone=layer8report_post:10m rate=6r/m;

upstream layer8report_api {
    server 127.0.0.1:48808;
    keepalive 8;
}

# HTTP → HTTPS redirect (both naked and www)
server {
    listen 80;
    listen [::]:80;
    server_name layer8report.com www.layer8report.com;
    return 301 https://www.layer8report.com$request_uri;
}

# HTTPS naked → www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name layer8report.com;

    ssl_certificate /etc/letsencrypt/live/layer8report.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layer8report.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.layer8report.com$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.layer8report.com;

    ssl_certificate /etc/letsencrypt/live/layer8report.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layer8report.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    root /var/www/layer8report.com/public;
    index index.html;
    charset utf-8;

    access_log off;
    error_log /var/log/nginx/layer8report.com.error.log crit;

    limit_req zone=layer8report_limit burst=20 nodelay;
    limit_req_status 429;
    server_tokens off;

    # Security headers. Only set here: any add_header inside a location would
    # drop all of these for that location, so locations use `expires` instead.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Discovery for agents that only look at headers.
    add_header Link "</agents.md>; rel=\"describedby\"; type=\"text/markdown\", </openapi.json>; rel=\"service-desc\"; type=\"application/openapi+json\", </llms.txt>; rel=\"help\"" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript text/plain text/xml text/markdown
               application/javascript application/json application/ld+json
               application/linkset+json application/xml image/svg+xml;

    # API. ^~ keeps the static regex locations below from catching
    # /api/v1/stats.md or /api/v1/badge.svg.
    location ^~ /api/ {
        limit_req zone=layer8report_limit burst=20 nodelay;
        limit_req zone=layer8report_post burst=3 nodelay;
        client_max_body_size 8k;

        proxy_pass http://layer8report_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        error_page 429 = @layer8report_slow;
        error_page 502 503 504 = @layer8report_down;
    }

    location @layer8report_slow {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Too many requests from this address. Even layer 9 takes breaks.","hint":"Wait 10 seconds.","docs":"https://www.layer8report.com/agents.md"}\n';
    }

    location @layer8report_down {
        default_type application/json;
        return 503 '{"error":"layer9_down","message":"Layer 9 is not answering. Try again shortly.","docs":"https://www.layer8report.com/agents.md"}\n';
    }

    # Block hidden files and WordPress probes. Listed before the other regex
    # locations because nginx uses the first regex that matches.
    location ~ /\. { deny all; }
    location ~* (wp-admin|wp-login|\.php$) { deny all; }

    # Filing and report card pages are one shell each, filled in by JS.
    location ^~ /r/ {
        expires -1;
        try_files /r.html =404;
    }
    location ^~ /h/ {
        expires -1;
        try_files /h.html =404;
    }

    # Agent discovery files, served as text so agents and people can read them.
    location = /.well-known/api-catalog {
        types { }
        default_type application/linkset+json;
        expires 1h;
    }
    location ^~ /.well-known/ {
        try_files $uri =404;
    }
    location ^~ /tools/ {
        types { }
        default_type "text/plain; charset=utf-8";
        expires 1h;
    }
    location ~* \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        expires 1h;
    }
    location = /openapi.json {
        expires 1h;
    }

    # HTML — never cache
    location ~* \.html$ {
        expires -1;
    }

    # CSS and JS are cache-busted with ?v= by deploy.sh, so they can be cached forever.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
    }

    # Try files
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /error/404.html;
}
